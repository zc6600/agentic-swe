name: Reusable PR Agent (patch only)

on:
  workflow_call:
    inputs:
      validation-command:
        description: Validation command for the caller repository.
        type: string
        required: true
      model:
        description: OpenRouter model identifier.
        type: string
        required: false
        default: deepseek/deepseek-v4.1-flash
      trigger-on:
        description: "When to call the agent: conflict-only (default) or always."
        type: string
        required: false
        default: conflict-only
      task-instructions:
        description: Optional repository-specific instructions.
        type: string
        required: false
        default: ""
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  agent:
    # Fork PR code is untrusted; this default workflow must never expose model secrets to it.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run PR Agent
        id: repair
        uses: zc6600/agentic-swe/pr-agent@main
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ inputs.model }}
          task-instructions: ${{ inputs.task-instructions }}
          validation-command: ${{ inputs.validation-command }}
          trigger-on: ${{ inputs.trigger-on }}

      - name: Upload repair artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-agent-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-agent-output/
          if-no-files-found: ignore
          retention-days: 7
