name: PR Agent Patch Producer
description: Review and repair a checked-out PR, emitting a JSON verdict and patch without publishing changes.

inputs:
  openrouter-api-key:
    description: OpenRouter API key used by DeepSeek Harness.
    required: true
  model:
    description: OpenRouter model identifier.
    required: false
    default: deepseek/deepseek-v4.1-flash
  task-instructions:
    description: Optional repository-specific instructions for the agent.
    required: false
    default: ""
  validation-command:
    description: Command to validate agent changes; skipped when conflict-only finds no conflicts.
    required: true
  trigger-on:
    description: Invoke the agent on conflict-only (default) or always.
    required: false
    default: conflict-only

outputs:
  verdict:
    description: PASS, BLOCK, or ERROR. PASS is not authorization to merge.
    value: ${{ steps.agent.outputs.verdict }}
  has-changes:
    description: Whether repair.patch contains changes.
    value: ${{ steps.agent.outputs.has-changes }}
  result-path:
    description: Absolute path of the JSON report in the runner.
    value: ${{ steps.agent.outputs.result-path }}
  patch-path:
    description: Absolute path of the patch in the runner.
    value: ${{ steps.agent.outputs.patch-path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Run PR Agent
      id: agent
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        PR_AGENT_MODEL: ${{ inputs.model }}
        PR_AGENT_TASK_INSTRUCTIONS: ${{ inputs.task-instructions }}
        PR_AGENT_VALIDATION_COMMAND: ${{ inputs.validation-command }}
        PR_AGENT_TRIGGER_ON: ${{ inputs.trigger-on }}
        PR_AGENT_OUTPUT_DIR: ${{ runner.temp }}/pr-agent-output
        DSH_PERMISSION_MODE: workspace-write
        DSH_TELEMETRY_DISABLED: "1"
      run: python3 "$GITHUB_ACTION_PATH/controller.py"
